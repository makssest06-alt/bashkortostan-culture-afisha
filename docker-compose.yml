# Полный стек «Афиши культуры Башкортостана»: PostgreSQL 16 + REST API / ИИ-агент + сайт + Telegram-бот.
#
#   ./scripts/bootstrap-env.sh
#   # впишите TELEGRAM_BOT_TOKEN в .env
#   docker compose up --build
#
# Сайт подключается через include (web/compose.yaml) и читает переменные из корневого .env.

include:
  - web/compose.yaml

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-afisha}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-afisha}
      POSTGRES_DB: ${POSTGRES_DB:-afisha}
    volumes:
      - afisha-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-afisha} -d ${POSTGRES_DB:-afisha}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  api:
    build:
      context: ./backend
    image: afisha-api:local
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # P0-2: API не публикуется наружу — снаружи доступен только сайт.
      # Прямой доступ (если нужен) — через localhost и отдельный reverse proxy.
      - "127.0.0.1:${API_PORT:-8000}:8000"
    environment:
      PORT: 8000
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-afisha}:${POSTGRES_PASSWORD:-afisha}@postgres:5432/${POSTGRES_DB:-afisha}}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      # P0-1: по умолчанию админка закрыта. ADMIN_OPEN=1 допустим только для локального демо
      # и запрещён в production (бэкенд не стартует).
      ADMIN_OPEN: ${ADMIN_OPEN:-}
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-http://localhost:3210}
      ASSISTANT_DISABLED: ${ASSISTANT_DISABLED:-}
      ASSISTANT_ENGINE: ${ASSISTANT_ENGINE:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-12000}
      LLM_COST_IN_RUB_PER_1K: ${LLM_COST_IN_RUB_PER_1K:-0.015}
      LLM_COST_OUT_RUB_PER_1K: ${LLM_COST_OUT_RUB_PER_1K:-0.06}
      FEEDBACK_RETENTION_DAYS: ${FEEDBACK_RETENTION_DAYS:-90}
      METRICS_RATE_LIMIT: ${METRICS_RATE_LIMIT:-120}
      READ_RATE_LIMIT: ${READ_RATE_LIMIT:-600}
      # /metrics в production доступен только с этим токеном (иначе 404).
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      # P0-2: по умолчанию заголовкам прокси не доверяем; включаем только за известным прокси.
      TRUST_PROXY: ${TRUST_PROXY:-0}
      # P0-3: лимиты и дневной бюджет ассистента.
      ASSISTANT_RATE_LIMIT_10M: ${ASSISTANT_RATE_LIMIT_10M:-20}
      ASSISTANT_DAILY_LIMIT: ${ASSISTANT_DAILY_LIMIT:-200}
      ASSISTANT_CONFIRM_LIMIT_10M: ${ASSISTANT_CONFIRM_LIMIT_10M:-20}
      ASSISTANT_MAX_TOKENS: ${ASSISTANT_MAX_TOKENS:-800}
      ASSISTANT_DAILY_BUDGET_RUB: ${ASSISTANT_DAILY_BUDGET_RUB:-100}
      # Retention: сроки хранения чувствительных данных.
      ASSISTANT_TRACE_RETENTION_DAYS: ${ASSISTANT_TRACE_RETENTION_DAYS:-30}
      CONFIRMATION_RETENTION_DAYS: ${CONFIRMATION_RETENTION_DAYS:-7}
      RAW_RECORD_RETENTION_DAYS: ${RAW_RECORD_RETENTION_DAYS:-180}
      IMPORT_RETENTION_DAYS: ${IMPORT_RETENTION_DAYS:-180}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-365}
      SUBSCRIPTION_INACTIVE_DAYS: ${SUBSCRIPTION_INACTIVE_DAYS:-180}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8000/api/v1/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  bot:
    build:
      context: ./bot
    image: afisha-bot:local
    depends_on:
      api:
        condition: service_healthy
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      API_BASE_URL: http://api:8000
      API_TIMEOUT_MS: ${API_TIMEOUT_MS:-10000}
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-http://localhost:3210}
      LOG_LEVEL: ${BOT_LOG_LEVEL:-info}
      SESSION_TTL_MINUTES: ${BOT_SESSION_TTL_MINUTES:-120}
      CALLBACK_TTL_MINUTES: ${BOT_CALLBACK_TTL_MINUTES:-720}
      RATE_LIMIT_PER_MINUTE: ${BOT_RATE_LIMIT_PER_MINUTE:-20}
      ASSISTANT_ENABLED: ${BOT_ASSISTANT_ENABLED:-0}
      ASSISTANT_CONFIRMATIONS: ${BOT_ASSISTANT_CONFIRMATIONS:-0}
      USER_REF_MODE: ${USER_REF_MODE:-hmac}
      LOG_HASH_SECRET: ${LOG_HASH_SECRET:-}
      USER_REF_SECRET: ${USER_REF_SECRET:-}
    restart: unless-stopped

volumes:
  afisha-postgres-data:
