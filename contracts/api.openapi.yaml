        image:
          $ref: ./event.schema.json#/properties/image
        title_ba:
          $ref: ./event.schema.json#/properties/title_ba
        synthetic:
          $ref: ./event.schema.json#/properties/synthetic
    ImportReport:
      type: object
      description: Отчёт об импорте. Всегда `received = added + updated + unchanged + len(rejected)`. Повтор того же файла
        даёт всё в `unchanged`.
      additionalProperties: false
      required:
      - import_id
      - format
      - received
      - added
      - updated
      - unchanged
      - rejected
      - disputed
      properties:
        import_id:
          type: string
          format: uuid
        format:
          type: string
          enum:
          - csv
          - json
        received:
          type: integer
          minimum: 0
        added:
          type: integer
          minimum: 0
        updated:
          type: integer
          minimum: 0
        unchanged:
          type: integer
          minimum: 0
        rejected:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - row
            - reason_code
            - reason
            properties:
              row:
                type: integer
                minimum: 1
                description: 'Номер записи с 1: строка данных CSV без заголовка или позиция в JSON-массиве.'
              source_hash:
                $ref: ./event.schema.json#/$defs/sha256
              reason_code:
                type: string
                description: Например `missing_field`, `invalid_date`, `invalid_category`, `invalid_price`, `invalid_age_limit`,
                  `invalid_url`.
              reason:
                type: string
                description: Понятная модератору причина по-русски.
        disputed:
          type: array
          description: 'Принятые, но спорные карточки: ушли в очередь модерации.'
          items:
            type: object
            additionalProperties: false
            required:
            - id
            - reasons
            properties:
              id:
                type: string
                format: uuid
              reasons:
                type: array
                items:
                  type: string
