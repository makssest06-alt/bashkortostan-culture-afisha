          description: Например `create`, `update`, `status_change`, `merge`, `import`.
        entity_type:
          type: string
          description: Например `event`, `subscription`.
        entity_id:
          type: string
        changes:
          type: array
          items:
            type: object
            required:
            - field
            - from
            - to
            properties:
              field:
                type: string
              from: {}
              to: {}
        import_id:
          type:
          - string
          - 'null'
          format: uuid
