        properties:
          action:
            const: merge
        required:
        - action
      then:
        required:
        - merge_into
    AuditEntry:
      type: object
      required:
      - id
      - at
      - actor
      - action
      - entity_type
      - entity_id
      - changes
      properties:
        id:
          type: string
          format: uuid
        at:
          $ref: ./event.schema.json#/$defs/dateTime
