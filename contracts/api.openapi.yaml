components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Токен модератора из переменной окружения бэка. Нет токена → 401, нет прав → 403.
  parameters:
    EventId:
      name: id
      in: path
      required: true
      description: UUID события. Невалидный UUID → 400 `validation_error`.
      schema:
        type: string
        format: uuid
    VenueIdPath:
      name: id
      in: path
      required: true
      description: Код площадки (`venue_id`) из `GET /venues`.
      schema:
        $ref: ./event.schema.json#/$defs/slug
    SubscriptionId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    City:
      name: city
      in: query
      required: false
      description: 'Коды городов из `GET /cities` через запятую: `ufa,sterlitamak`.'
      style: form
      explode: false
      schema:
        type: array
        items:
          $ref: ./event.schema.json#/$defs/slug
        maxItems: 20
    Category:
      name: category
      in: query
      required: false
      description: Категории через запятую.
      style: form
      explode: false
      schema:
        type: array
        items:
          $ref: ./event.schema.json#/$defs/category
        maxItems: 7
    Date:
      name: date
      in: query
      required: false
      description: Готовый период или конкретная дата `YYYY-MM-DD`. Вместе с `date_from`/`date_to` → 400 `validation_error`.
        Считается от `reference_date` в поясе региона.
      schema:
        type: string
        pattern: ^(today|tomorrow|weekend|week|[0-9]{4}-[0-9]{2}-[0-9]{2})$
      example: weekend
    DateFrom:
      name: date_from
      in: query
      required: false
      description: Начало периода включительно, местная дата.
      schema:
        type: string
        format: date
    DateTo:
      name: date_to
      in: query
      required: false
      description: Конец периода включительно, местная дата. Не раньше `date_from`.
      schema:
        type: string
        format: date
    TimeFrom:
      name: time_from
      in: query
      required: false
      description: Начало не раньше этого местного времени `HH:MM`. События с `time_precision = date` не проходят.
      schema:
        type: string
        pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
    TimeTo:
      name: time_to
      in: query
      required: false
      description: Начало не позже этого местного времени `HH:MM`.
      schema:
        type: string
        pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
    PriceMax:
      name: price_max
      in: query
      required: false
      description: Максимальная цена в рублях. Проходят события с известной ценой `price_min ≤ price_max`. События с неизвестной
        ценой не проходят и считаются в `hidden_unknown_price`.
      schema:
        type: integer
        minimum: 0
    Free:
      name: free
      in: query
      required: false
      description: '`true` — только `is_free = true`.'
      schema:
        type: boolean
    Age:
      name: age
      in: query
      required: false
      description: Возраст посетителя. Проходят события с `age_limit ≤ age`. События с неизвестным возрастом не проходят и
        считаются в `hidden_unknown_age`.
      schema:
        type: integer
        minimum: 0
        maximum: 120
    VenueIdQuery:
      name: venue_id
      in: query
      required: false
      description: Код площадки.
      schema:
        $ref: ./event.schema.json#/$defs/slug
    Language:
      name: language
      in: query
      required: false
      description: 'Язык мероприятия, код ISO 639: `ru`, `ba`, `tt`.'
      schema:
        type: string
        pattern: ^[a-z]{2,3}$
    Q:
      name: q
      in: query
      required: false
      description: Текстовый поиск по названию, площадке и описанию.
      schema:
        type: string
        minLength: 1
        maxLength: 200
    Sort:
      name: sort
      in: query
      required: false
      description: '`date` — по времени начала, `price` — по `price_min` (неизвестная цена в конце), `popularity` — по `popularity`
        убыванию.'
      schema:
        type: string
        enum:
        - date
        - price
        - popularity
        default: date
    Page:
      name: page
      in: query
      required: false
      description: Номер страницы с 1.
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 12
    UserRef:
      name: user_ref
      in: query
      required: true
      description: Непрозрачный идентификатор пользователя, см. схему `SubscriptionCreate`.
      schema:
        $ref: '#/components/schemas/UserRef'
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: ETag из прошлого ответа. Совпал → 304 без тела.
      schema:
        type: string
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: ETag карточки из `GET /admin/events/{id}`. Нет заголовка → 409 `conflict`, не совпал → 412 `precondition_failed`.
      schema:
        type: string
    RequestIdIn:
      name: X-Request-Id
      in: header
      required: false
      description: Идентификатор запроса от клиента для сквозной трассировки. Если не передан, сервер создаёт свой.
      schema:
        type: string
        maxLength: 128
  headers:
    XRequestId:
      description: Идентификатор запроса. Есть в каждом ответе, совпадает с `request_id` в теле ошибки.
      schema:
        type: string
      example: req_01JDEMO0000000000000000000
    ETag:
      description: Версия ресурса для `If-None-Match` и `If-Match`.
      schema:
        type: string
      example: '"ev-3c1f9a"'
    CacheControlCard:
      description: Для карточки события.
      schema:
        type: string
      example: public, max-age=60
    CacheControlDict:
      description: Для справочников.
      schema:
        type: string
      example: public, max-age=300
    RetryAfter:
      description: Через сколько секунд можно повторить запрос.
      schema:
        type: integer
        minimum: 0
      example: 30
    Location:
      description: Адрес созданного ресурса.
      schema:
        type: string
  responses:
    BadRequest:
      description: Неверные параметры или тело запроса (`validation_error`, `invalid_json`).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: validation_error
            message: 'Проверьте условия поиска: дата указана в неверном формате.'
            details:
            - field: date
              message: Ожидается today, tomorrow, weekend, week или дата ГГГГ-ММ-ДД.
            request_id: req_01JDEMO0000000000000000000
    Unauthorized:
      description: Нет токена модератора или он недействителен.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: unauthorized
            message: Нужно войти в админку.
            details: []
            request_id: req_01JDEMO0000000000000000000
    Forbidden:
      description: Токен действителен, но прав не хватает.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: forbidden
            message: Недостаточно прав для этого действия.
            details: []
            request_id: req_01JDEMO0000000000000000000
    NotFound:
      description: Ресурс не найден. Черновик события публично тоже даёт 404.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: not_found
            message: Событие не найдено. Возможно, ссылка устарела.
            details: []
            request_id: req_01JDEMO0000000000000000000
    Conflict:
      description: 'Конфликт: повтор записи или нет `If-Match`.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: conflict
            message: Такая подписка уже есть.
            details: []
            request_id: req_01JDEMO0000000000000000000
    PreconditionFailed:
      description: '`If-Match` не совпал: карточку уже изменили.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: precondition_failed
            message: Карточку только что изменил другой модератор. Обновите страницу и повторите правку.
            details: []
            request_id: req_01JDEMO0000000000000000000
    PayloadTooLarge:
      description: Тело запроса слишком большое.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: payload_too_large
            message: Файл слишком большой. Разделите его на части.
            details: []
            request_id: req_01JDEMO0000000000000000000
    Unprocessable:
      description: Данные корректны по формату, но противоречат правилам.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: unprocessable
            message: Минимальная цена больше максимальной.
            details:
            - field: price_min
              message: Должна быть не больше price_max.
            request_id: req_01JDEMO0000000000000000000
    RateLimited:
      description: Слишком много запросов.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: rate_limited
            message: Слишком много запросов. Попробуйте через 30 секунд.
            details: []
            request_id: req_01JDEMO0000000000000000000
    InternalError:
      description: Внутренняя ошибка. Подробности только в логах по `request_id`.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: internal_error
            message: Что-то пошло не так. Мы уже разбираемся, попробуйте позже.
            details: []
            request_id: req_01JDEMO0000000000000000000
    Unavailable:
      description: Сервис временно недоступен (например, нет связи с базой).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: unavailable
            message: Сервис временно недоступен. Попробуйте через минуту.
            details: []
            request_id: req_01JDEMO0000000000000000000
    NotModified:
      description: Ресурс не изменился с прошлого запроса (`If-None-Match` совпал). Тела нет.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        ETag:
          $ref: '#/components/headers/ETag'
  schemas:
    Event:
      $ref: ./event.schema.json
    Error:
      type: object
      description: 'Единый формат ошибки, без обёртки. `message` пишется по-русски для жителя, без технических деталей. Коды:
        400 `validation_error`/`invalid_json`, 401 `unauthorized`, 403 `forbidden`, 404 `not_found`, 405 `method_not_allowed`,
        409 `conflict`, 412 `precondition_failed`, 413 `payload_too_large`, 422 `unprocessable`, 429 `rate_limited`, 500 `internal_error`,
        503 `unavailable`.'
      additionalProperties: false
      required:
      - code
      - message
      - details
      - request_id
      properties:
        code:
          type: string
          enum:
          - validation_error
          - invalid_json
          - unauthorized
          - forbidden
          - not_found
          - method_not_allowed
          - conflict
          - precondition_failed
          - payload_too_large
          - unprocessable
          - rate_limited
          - internal_error
          - unavailable
        message:
          type: string
          minLength: 1
        details:
          type: array
          description: Подробности по полям. Пустой массив, если их нет.
          items:
            $ref: '#/components/schemas/ErrorDetail'
        request_id:
          type: string
          description: Совпадает с заголовком `X-Request-Id`.
    ErrorDetail:
      type: object
      additionalProperties: false
      required:
      - message
      properties:
        field:
          type: string
          description: Имя параметра или поля.
        message:
          type: string
          minLength: 1
    EventList:
      type: object
      description: Страница событий. Обязательны `items`, `page`, `page_size`, `total`, `total_pages`. Остальное — необязательные
        расширения ответа.
      required:
      - items
      - page
      - page_size
      - total
      - total_pages
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Event'
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
          maximum: 50
        total:
          type: integer
          minimum: 0
        total_pages:
          type: integer
          minimum: 0
        facets:
          $ref: '#/components/schemas/Facets'
        relaxations:
          type: array
          description: Как ослабить условия, если `total = 0`. У каждого варианта посчитанное число событий. Сервер сам условия
            не ослабляет.
          items:
            $ref: '#/components/schemas/Relaxation'
        hidden_unknown_price:
          type: integer
          minimum: 0
          description: Сколько событий подошло бы, но цена у них не указана.
        hidden_unknown_age:
          type: integer
          minimum: 0
          description: Сколько событий подошло бы, но возраст у них не указан.
        reference_date:
          type: string
          format: date
          description: Текущая дата в поясе региона, от неё считались `today` и `weekend`.
        timezone:
          type: string
          example: Asia/Yekaterinburg
    Facets:
      type: object
      description: Расширение. Счётчики для фильтров. Счётчик измерения считается без условия этого измерения.
      required:
      - cities
      - categories
      - age_limits
      - price
      - total
      properties:
        cities:
          type: array
          items:
            $ref: '#/components/schemas/FacetEntry'
        categories:
          type: array
          items:
            $ref: '#/components/schemas/FacetEntry'
        age_limits:
          type: array
          items:
            type: object
            required:
            - value
            - count
            properties:
              value:
                $ref: ./event.schema.json#/properties/age_limit
              count:
                type: integer
                minimum: 0
        price:
          type: object
          required:
          - free
          - paid
          - unknown
          properties:
            free:
              type: integer
              minimum: 0
            paid:
              type: integer
              minimum: 0
            unknown:
              type: integer
              minimum: 0
        total:
          type: integer
          minimum: 0
    FacetEntry:
      type: object
      required:
      - id
      - name
      - count
      properties:
        id:
          type: string
        name:
          type: string
        count:
          type: integer
          minimum: 0
    Relaxation:
      type: object
      required:
      - code
      - codes
      - label
      - count
      properties:
        code:
          type: string
          enum:
          - date
          - time
          - budget
          - city
          - venue
          - category
          - age
          - query
          description: Главное ослабленное условие.
        codes:
          type: array
          items:
            type: string
            enum:
            - date
            - time
            - budget
            - city
            - venue
            - category
            - age
            - query
          description: Все ослабленные условия.
        label:
          type: string
          description: 'Подпись без числа: «Без ограничения цены».'
        query:
          type: object
          description: Параметры `GET /events` с уже ослабленным условием.
          additionalProperties:
            type:
            - string
            - integer
            - boolean
        count:
          type: integer
          minimum: 1
    City:
      type: object
      required:
      - id
      - name
      - lat
      - lon
      properties:
        id:
          $ref: ./event.schema.json#/$defs/slug
        name:
          type: string
        name_ba:
          type:
          - string
          - 'null'
        lat:
          type:
          - number
          - 'null'
        lon:
          type:
          - number
          - 'null'
    Venue:
      type: object
      required:
      - id
      - name
      - city_id
      - city
      - address
      - lat
      - lon
      properties:
        id:
          $ref: ./event.schema.json#/$defs/slug
        name:
          type: string
        city_id:
          $ref: ./event.schema.json#/$defs/slug
        city:
          type: string
        address:
          type:
          - string
          - 'null'
        lat:
          type:
          - number
          - 'null'
        lon:
          type:
          - number
          - 'null'
    Category:
      type: object
      required:
      - id
      - name
      properties:
        id:
          $ref: ./event.schema.json#/$defs/category
        name:
          type: string
        name_ba:
          type:
          - string
          - 'null'
    CityList:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/City'
    VenueList:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Venue'
    CategoryList:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Category'
          minItems: 7
          maxItems: 7
    VenueSchedule:
      type: object
      required:
      - venue
      - date_from
      - date_to
      - items
      properties:
        venue:
          $ref: '#/components/schemas/Venue'
        date_from:
          type: string
          format: date
        date_to:
          type: string
          format: date
        items:
          type: array
          description: Опубликованные события площадки за период по времени начала.
          items:
            $ref: '#/components/schemas/Event'
    UserRef:
      type: string
      description: Непрозрачный идентификатор пользователя. Бот передаёт HMAC от chat_id с серверной солью, сайт — случайный
        идентификатор браузера. Телефон, username и другие ПДн сюда не кладутся.
      pattern: ^[A-Za-z0-9_-]{16,128}$
    SubscriptionCreate:
      type: object
      additionalProperties: false
      required:
      - channel
      - user_ref
      properties:
        channel:
          type: string
          enum:
          - telegram
          - web
        user_ref:
          $ref: '#/components/schemas/UserRef'
        city:
          anyOf:
          - $ref: ./event.schema.json#/$defs/slug
          - type: 'null'
        category:
          anyOf:
          - $ref: ./event.schema.json#/$defs/category
          - type: 'null'
        period:
          description: 'Период подписки: те же готовые значения, что у параметра `date`, без конкретной даты.'
          enum:
          - today
          - tomorrow
          - weekend
          - week
          - null
    Subscription:
      type: object
      required:
      - id
      - channel
      - user_ref
      - city
      - category
      - period
      - created_at
      properties:
        id:
          type: string
          format: uuid
        channel:
          type: string
          enum:
          - telegram
          - web
        user_ref:
          $ref: '#/components/schemas/UserRef'
        city:
          anyOf:
          - $ref: ./event.schema.json#/$defs/slug
          - type: 'null'
        category:
          anyOf:
          - $ref: ./event.schema.json#/$defs/category
          - type: 'null'
        period:
          description: 'Период подписки: те же готовые значения, что у параметра `date`, без конкретной даты.'
          enum:
          - today
          - tomorrow
          - weekend
          - week
          - null
        created_at:
          $ref: ./event.schema.json#/$defs/dateTime
    SubscriptionList:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Subscription'
    FeedbackCreate:
      type: object
      additionalProperties: false
      required:
      - kind
      - name
      - contact
      - text
      - website
      properties:
        kind:
          type: string
          enum:
          - organizer_application
          - correction
          - question
        event_id:
          type:
          - string
          - 'null'
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 100
        contact:
          type: string
          minLength: 3
          maxLength: 200
          description: Как связаться для ответа. Только для ответа организатору, в логи не пишется.
        organization:
          type:
          - string
          - 'null'
          maxLength: 200
        text:
          type: string
          minLength: 1
          maxLength: 2000
        website:
          type: string
          description: 'Honeypot: поле скрыто от людей и должно быть пустым. Если заполнено, сервер отвечает 202 как обычно,
            но обращение не сохраняет.'
    FeedbackAccepted:
      type: object
      required:
      - id
      - status
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          const: received
    Health:
      type: object
      required:
      - status
      - checks
      - version
      properties:
        status:
          type: string
          enum:
          - ok
          - degraded
          description: '`degraded` — сервис отвечает, но часть зависимостей недоступна (например, модель выключена и агент
            в резервном режиме).'
        checks:
          type: object
          description: 'Состояние зависимостей: `database`, `model`, источники.'
          additionalProperties:
            type: string
            enum:
            - ok
            - degraded
            - fail
            - disabled
        version:
          type: string
    EventImportRecord:
      type: object
      description: 'Запись импорта: те же поля, что у события. Сервер сам вычисляет `id`, `normalized_title`, `dedup_key`,
        `created_at`, `updated_at`, а также `source_hash`, если его нет. Неизвестные поля сохраняются в сырой записи и в карточку
        не попадают.'
