      type: object
      required:
      - items
      - page
      - page_size
      - total
      - total_pages
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditEntry'
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
          maximum: 50
        total:
          type: integer
          minimum: 0
        total_pages:
          type: integer
          minimum: 0
