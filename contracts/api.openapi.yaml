      - event
      - reasons
      - duplicate_candidates
      properties:
        event:
          $ref: '#/components/schemas/Event'
        reasons:
          type: array
          items:
            type: string
          description: Почему карточка спорная.
        duplicate_candidates:
          type: array
          items:
            type: string
            format: uuid
          description: Возможные дубли для действия `merge`.
    ModerationList:
      type: object
      required:
      - items
      - page
      - page_size
      - total
      - total_pages
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ModerationItem'
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
          maximum: 50
        total:
          type: integer
          minimum: 0
        total_pages:
          type: integer
          minimum: 0
    ModerationResolve:
      type: object
      additionalProperties: false
      required:
      - action
      properties:
        action:
          type: string
          enum:
          - publish
          - keep_draft
          - cancel
          - merge
        merge_into:
          type: string
          format: uuid
          description: Куда слить карточку. Обязательно при `merge`.
