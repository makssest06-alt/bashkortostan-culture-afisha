# Контракт v1. Сгенерирован один раз и дальше правится руками; при правке прогнать линтер из README.
openapi: 3.1.0
info:
  title: Афиша культуры Башкортостана — API
  version: 1.0.0
  description: |-
    Открытый контракт афиши, уровень 2 ТЗ (п. 6.3). Один API для сайта, Telegram-бота, виджета и ИИ-агента.

    **Общие правила**

    - Префикс `/api/v1`, JSON в UTF-8, имена полей в `snake_case`. В примерах curl `$API` — адрес вида `http://<хост>/api/v1`.
    - Событие — `contracts/event.schema.json` (строго по п. 8.1). Правила полей — `docs/EVENT_SCHEMA.md`.
    - Деньги — целые рубли. Даты — RFC 3339 с поясом, регион живёт по `Asia/Yekaterinburg` (+05:00).
    - Публичный список отдаёт только `published`. `cancelled` открывается по прямой ссылке, `draft` публично даёт 404.
    - Каждый ответ несёт `X-Request-Id`. Клиент может прислать свой, сервер его вернёт.
    - Ошибки — единый формат `Error` без обёртки: `{ code, message, details, request_id }`. `message` пишется по-русски для жителя.
    - Кеширование: `ETag` и `Cache-Control` у карточки (`max-age=60`) и справочников (`max-age=300`), `If-None-Match` → 304.
    - Лимит частоты по IP на всех публичных методах, строже на `POST /feedback`: 429 и `Retry-After`. Значения лимитов задаёт бэк и пишет в README.
    - CORS: публичные методы отдают `Access-Control-Allow-Origin: *`, сторонние cookies не нужны (виджет работает без них). На `OPTIONS` — 204.
    - Админка (`/admin/*`) — Bearer-токен модератора.

    **Версии.** Добавление необязательных полей и методов не меняет версию. Удаление, переименование поля или смена его типа — только через `/api/v2`.

    Инструменты ИИ-агента (п. 7.2) вызывают эти методы: `contracts/agent_tools.json`. Исследовательский контракт сессий ассистента `contracts/public_api.openapi.json` в v1 не входит.
servers:
- url: /api/v1
  description: 'Относительный адрес: тот же хост, что у сайта или бота.'
tags:
- name: events
  description: События и расписание
- name: dictionaries
  description: Справочники городов, площадок и категорий
- name: subscriptions
  description: Подписки
- name: feedback
  description: Обратная связь и заявки организаторов
- name: service
  description: Здоровье и метрики
- name: admin
  description: 'Админка: импорт, правка, модерация, журнал'
