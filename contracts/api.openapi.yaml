        category:
          $ref: ./event.schema.json#/properties/category
        tags:
          $ref: ./event.schema.json#/properties/tags
        date_start:
          $ref: ./event.schema.json#/properties/date_start
        date_end:
          $ref: ./event.schema.json#/properties/date_end
        duration_min:
          $ref: ./event.schema.json#/properties/duration_min
        city:
          $ref: ./event.schema.json#/properties/city
        venue:
          $ref: ./event.schema.json#/properties/venue
        address:
          $ref: ./event.schema.json#/properties/address
        lat:
          $ref: ./event.schema.json#/properties/lat
        lon:
          $ref: ./event.schema.json#/properties/lon
        description:
          $ref: ./event.schema.json#/properties/description
        price_min:
          $ref: ./event.schema.json#/properties/price_min
        price_max:
          $ref: ./event.schema.json#/properties/price_max
        is_free:
          $ref: ./event.schema.json#/properties/is_free
        age_limit:
          $ref: ./event.schema.json#/properties/age_limit
        language:
          $ref: ./event.schema.json#/properties/language
        org_link:
          $ref: ./event.schema.json#/properties/org_link
        source_url:
          $ref: ./event.schema.json#/properties/source_url
        source_type:
          $ref: ./event.schema.json#/properties/source_type
        source_hash:
          $ref: ./event.schema.json#/properties/source_hash
        verified_at:
          $ref: ./event.schema.json#/properties/verified_at
        confidence:
          $ref: ./event.schema.json#/properties/confidence
        status:
          $ref: ./event.schema.json#/properties/status
        city_id:
          $ref: ./event.schema.json#/properties/city_id
        venue_id:
          $ref: ./event.schema.json#/properties/venue_id
        time_precision:
          $ref: ./event.schema.json#/properties/time_precision
        offers:
          $ref: ./event.schema.json#/properties/offers
        occurrences:
          $ref: ./event.schema.json#/properties/occurrences
        organizer:
          $ref: ./event.schema.json#/properties/organizer
        kind:
